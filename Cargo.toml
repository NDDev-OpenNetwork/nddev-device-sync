[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters-memory",
    "crates/adapters-keyring",
    "crates/desktop",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["NDDev OpenNetwork"]

[workspace.dependencies]
nddev-device-sync-domain = { path = "crates/domain", version = "0.1.0" }
nddev-device-sync-application = { path = "crates/application", version = "0.1.0" }
nddev-device-sync-adapters-memory = { path = "crates/adapters-memory", version = "0.1.0" }
nddev-device-sync-adapters-keyring = { path = "crates/adapters-keyring", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tauri = "2.8.5"
tauri-build = "2.4.1"
